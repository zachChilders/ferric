[package]
name = "ferric_stdlib"
version = "0.1.0"
edition = "2024"

[dependencies]
ferric_common = { path = "../ferric_common" }
ferric_stdlib_meta = { path = "../ferric_stdlib_meta" }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
regex = "1"
rand = "0.8"
rand_chacha = "0.3"
base64 = "0.22"
hex = "0.4"
urlencoding = "2"
sha2 = "0.10"
blake3 = "1"
hmac = "0.12"
chacha20poly1305 = "0.10"
aes-gcm = "0.10"
argon2 = "0.5"
ed25519-dalek = { version = "2", features = ["rand_core"] }
subtle = "2"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "json", "gzip"] }
wait-timeout = "0.2"
tiny_http = "0.12"

[dev-dependencies]
serial_test = "3"
